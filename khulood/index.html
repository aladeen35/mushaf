<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خلود</title>
<meta name="description" content="خلود: لتخليد ذكرى الأنبياء والتابعين — موسوعة الأنبياء والرسل والصالحين من بداية الخلق إلى العصر الحاضر — كتاب إلكتروني تفاعلي بتمييز لوني لمصادر القصص.">
<meta name="theme-color" content="#0a3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="القائمة">☰</button>
  <a class="brand" href="#home"><img src="img/khulood-mark.png" alt="" class="brand-mark"><span>خلود</span><small>موسوعة الأنبياء والصالحين</small></a>
  <nav class="topnav" id="topnav">
    <a href="#home" data-nav="home">الرئيسية</a>
    <a href="#read-ch01" data-nav="read">القراءة</a>
    <a href="#book-ch01" data-nav="book">الكتاب</a>
    <a href="#compare" data-nav="compare">المقارنة</a>
    <a href="#tree" data-nav="tree">الأنساب</a>
    <a href="#atlas" data-nav="atlas">الأطلس</a>
    <a href="#saved" data-nav="saved">محفوظاتي</a>
  </nav>
  <div class="top-actions">
    <button class="icon-btn" id="searchBtn" aria-label="بحث" title="بحث"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
    <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات" title="الإعدادات"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="pill-btn" id="authBtn">دخول</button>
  </div>
</header>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><strong>التبويبات</strong><button class="icon-btn" data-close="drawer">✕</button></div>
  <ol class="toc" id="toc"></ol>
</aside>
<div class="scrim" id="scrim"></div>

<main id="view" tabindex="-1"></main>

<!-- audio dock -->
<div class="audio-dock" id="audioDock" hidden>
  <button class="icon-btn" id="audPrev" title="السابق">⏮</button>
  <button class="play-btn" id="audPlay" title="تشغيل/إيقاف">▶</button>
  <button class="icon-btn" id="audNext" title="التالي">⏭</button>
  <div class="aud-info"><div class="aud-title" id="audTitle"></div><div class="aud-sub" id="audSub"></div></div>
  <select id="audRate" title="السرعة"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
  <button class="icon-btn" id="audClose" title="إغلاق">✕</button>
</div>

<!-- popover for verse / hadith -->
<div class="modal" id="refModal" hidden>
  <div class="modal-card ref-card" role="dialog" aria-modal="true">
    <button class="icon-btn modal-x" data-close="refModal">✕</button>
    <div id="refBody"></div>
  </div>
</div>

<!-- settings -->
<div class="modal" id="settingsModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="icon-btn modal-x" data-close="settingsModal">✕</button>
    <h3>الإعدادات</h3>
    <label class="field">حجم الخط <input type="range" id="setFont" min="15" max="26" step="1"></label>
    <div class="field">المظهر
      <div class="seg" id="setTheme"><button data-v="light">فاتح</button><button data-v="sepia">ورقي</button><button data-v="dark">داكن</button></div>
    </div>
    <label class="field">الصوت <select id="setVoice"></select></label>
    <label class="field check"><input type="checkbox" id="setRecite"> تلاوة الآيات بصوت قارئ عند ورودها أثناء الاستماع</label>
    <label class="field">القارئ <select id="setReciter">
      <option value="Alafasy_128kbps">مشاري العفاسي</option>
      <option value="Husary_128kbps">محمود خليل الحصري</option>
      <option value="Minshawy_Murattal_128kbps">محمد صديق المنشاوي</option>
      <option value="Abdul_Basit_Murattal_192kbps">عبد الباسط عبد الصمد</option>
    </select></label>
    <p class="hint" id="voiceHint"></p>
  </div>
</div>

<!-- auth -->
<div class="modal" id="authModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <button class="icon-btn modal-x" data-close="authModal">✕</button>
    <div id="authBody"></div>
  </div>
</div>

<!-- search -->
<div class="modal" id="searchModal" hidden>
  <div class="modal-card search-card" role="dialog" aria-modal="true">
    <button class="icon-btn modal-x" data-close="searchModal">✕</button>
    <input type="search" id="searchInput" placeholder="ابحث في القصص والفصول…" autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<nav class="tabbar" id="tabbar">
  <a href="#home" data-nav="home"><i>⌂</i>الرئيسية</a>
  <a href="#read-ch01" data-nav="read" id="tabRead"><i>📰</i>القراءة</a>
  <a href="#book-ch01" data-nav="book" class="center" id="tabBook"><i>📖</i>الكتاب</a>
  <a href="#compare" data-nav="compare"><i>⚖</i>المقارنة</a>
  <a href="#saved" data-nav="saved"><i>★</i>محفوظاتي</a>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="vendor/d3.min.js" charset="utf-8"></script>
<script src="vendor/topojson-client.min.js" charset="utf-8"></script>
<script src="firebase-config.js" charset="utf-8"></script>
<script src="data/book.js" charset="utf-8"></script>
<script src="data/quran.js" charset="utf-8"></script>
<script src="data/hadith.js" charset="utf-8"></script>
<script src="data/extra.js" charset="utf-8"></script>
<script src="js/core.js" charset="utf-8"></script>
<script src="js/audio.js" charset="utf-8"></script>
<script src="js/reader.js" charset="utf-8"></script>
<script src="js/book3d.js" charset="utf-8"></script>
<script src="js/explore.js" charset="utf-8"></script>
<script src="js/app.js" charset="utf-8"></script>
</body>
</html>
